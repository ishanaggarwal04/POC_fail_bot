name: POC Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "50 19 * * *"   # daily at 3:00 AM UTC (~8:30 AM IST) -- adjust as needed

permissions:
  contents: read

jobs:
  poc-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Process POCs in batches
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          while true
          do
            echo "========================================"
            echo "Starting POC batch"
            echo "========================================"

            OUTPUT=$(uv run python -u main.py --apply 2>&1)
            EXIT_CODE=$?

            echo "$OUTPUT"

            if [ $EXIT_CODE -ne 0 ]; then
              echo "POC bot failed."
              exit $EXIT_CODE
            fi

            if echo "$OUTPUT" | grep -q "0 update(s) due this run."; then
              echo "========================================"
              echo "All POCs have been processed."
              echo "========================================"
              break
            fi

            echo "Batch completed."
            echo "Starting next batch immediately..."
            echo ""
          done